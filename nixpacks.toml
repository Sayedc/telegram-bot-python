[phases.setup]
nixPkgs = ["python310", "ffmpeg", "xvfb", "xauth", "chromium"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install --upgrade yt-dlp yt-dlp-nightly",
  "pip install -r requirements.txt",
  "playwright install chromium",
  "playwright install-deps chromium || true"
]

[phases.start]
cmd = "python main.py"
