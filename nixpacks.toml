[phases.setup]
nixPkgs = ["python312", "ffmpeg", "xvfb", "xauth", "chromium"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt",
  "pip install --upgrade 'yt-dlp[default]'",
  "playwright install chromium",
  "playwright install-deps chromium || true"
]

[phases.start]
cmd = "python main.py"
